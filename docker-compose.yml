version: "3.8"

services:
  mariadb:
    image: mariadb:10.11
    container_name: erp-mariadb
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: admin
      MYSQL_CHARACTER_SET_SERVER: utf8mb4
      MYSQL_COLLATION_SERVER: utf8mb4_unicode_ci
    volumes:
      - mariadb-data:/var/lib/mysql
      - ./mariadb.cnf:/etc/mysql/mariadb.conf.d/frappe.cnf:ro
    ports:
      - "3307:3306"
    healthcheck:
      test: ["CMD", "mariadb-admin", "ping", "-padmin"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis-cache:
    image: redis:7-alpine
    container_name: erp-redis-cache
    restart: unless-stopped
    ports:
      - "13000:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis-queue:
    image: redis:7-alpine
    container_name: erp-redis-queue
    restart: unless-stopped
    ports:
      - "11000:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  erpnext:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: erp-app
    restart: unless-stopped
    depends_on:
      mariadb:
        condition: service_healthy
      redis-cache:
        condition: service_healthy
      redis-queue:
        condition: service_healthy
    ports:
      - "8000:8000"
      - "9000:9000"
    volumes:
      - bench-data:/home/frappe/frappe-bench
      - ./apps/transport:/home/frappe/custom-apps/transport:ro
    environment:
      - FRAPPE_BRANCH=version-15
      - ERPNEXT_BRANCH=version-15
      - DB_HOST=mariadb
      - DB_PORT=3306
      - DB_ROOT_PASSWORD=admin
      - REDIS_CACHE=redis://redis-cache:6379
      - REDIS_QUEUE=redis://redis-queue:6379
      - SITE_NAME=erp.localhost
      - ADMIN_PASSWORD=admin123
    stdin_open: true
    tty: true

volumes:
  mariadb-data:
  bench-data:
